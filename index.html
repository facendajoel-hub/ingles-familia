<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family English Pro | Pre-A1 - C2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Family English Pro</div>
      <div id="header-actions" class="hidden" style="display:flex; gap:8px; align-items:center;">
        <span class="badge" id="hdr-streak">🔥 0</span>
        <span class="badge" id="hdr-xp">⭐ 0 XP</span>
        <button class="btn btn-outline btn-sm" onclick="renderHome()">Perfiles</button>
      </div>
    </header>
    <section id="view-profiles">
      <h1>¿Quién va a practicar hoy?</h1>
      <p class="subtitle">Ruta completa desde Cero (Pre-A1) hasta Maestría C2.</p>
      <div class="grid-profiles" id="profiles-grid"></div>
      <div class="card"><h3>🏆 Tabla Familiar</h3><div id="leaderboard"></div></div>
    </section>
    <section id="view-test" class="hidden"></section>
    <section id="view-dashboard" class="hidden">
      <div class="row-between" style="margin-bottom:18px;">
        <div><h1 id="dash-welcome">Hola</h1><p class="subtitle" id="dash-subtitle">Nivel actual</p></div>
        <button class="btn btn-outline btn-sm" onclick="renderHome()">🔄 Cambiar perfil</button>
      </div>
      <div id="roadmap-list"></div>
    </section>
    <section id="view-lesson" class="hidden">
      <div class="row-between">
        <button class="btn btn-outline btn-sm" onclick="showRoadmap()">← Volver al mapa</button>
        <span id="lesson-mode-badge" class="badge">Nivel</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="lesson-progress"></div></div>
      <div class="card" id="lesson-container"></div>
    </section>
  </div>

<script>
const SVGS = {
  trader: '<svg viewBox="0 0 100 100" width="74" height="74"><circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><path d="M14 68 L30 55 L46 62 L66 36 L86 24" fill="none" stroke="#10b981" stroke-width="3"/><rect x="25" y="58" width="4" height="14" fill="#10b981"/><rect x="64" y="32" width="4" height="22" fill="#10b981"/><circle cx="50" cy="38" r="14" fill="#f1c27d"/><path d="M36 35 Q50 20 64 35" fill="#1e293b"/><path d="M26 88 Q50 64 74 88" fill="#1e3a8a"/><polygon points="50,54 46,72 50,78 54,72" fill="#38bdf8"/></svg>',
  korean: '<svg viewBox="0 0 100 100" width="74" height="74"><circle cx="50" cy="50" r="48" fill="#1e1b4b" stroke="#f472b6" stroke-width="3"/><path d="M28 45 Q28 18 50 18 Q72 18 72 45 L75 78 L25 78 Z" fill="#0f172a"/><circle cx="50" cy="42" r="15" fill="#fde68a"/><path d="M35 38 Q50 26 65 38" fill="#0f172a"/><circle cx="44" cy="42" r="1.8" fill="#0f172a"/><circle cx="56" cy="42" r="1.8" fill="#0f172a"/><path d="M46 49 Q50 52 54 49" fill="none" stroke="#e11d48" stroke-width="2"/><path d="M26 88 Q50 64 74 88" fill="#f8fafc"/></svg>',
  soto1: '<svg viewBox="0 0 100 100" width="74" height="74"><circle cx="50" cy="50" r="48" fill="#0c4a6e" stroke="#facc15" stroke-width="3"/><line x1="70" y1="14" x2="44" y2="55" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><circle cx="48" cy="40" r="13" fill="#c68642"/><path d="M35 34 Q48 22 61 34 Z" fill="#1d4ed8"/><rect x="48" y="31" width="18" height="4" rx="2" fill="#1e40af"/><path d="M26 88 Q48 62 72 88" fill="#f8fafc"/><text x="41" y="80" font-size="14" font-weight="bold" fill="#1d4ed8">22</text></svg>',
  soto2: '<svg viewBox="0 0 100 100" width="74" height="74"><circle cx="50" cy="50" r="48" fill="#064e3b" stroke="#34d399" stroke-width="3"/><circle cx="50" cy="36" r="13" fill="#c68642"/><path d="M37 32 Q50 18 63 32 Z" fill="#1e3a8a"/><path d="M22 86 Q50 56 78 86" fill="#1e3a8a"/><text x="41" y="78" font-size="15" font-weight="bold" fill="#facc15">22</text><path d="M24 68 L36 58 M76 68 L64 58" stroke="#c68642" stroke-width="4" stroke-linecap="round"/></svg>'
};

const LVLS = ["Pre-A1", "A1", "A2", "B1", "B2", "C1", "C2"];
const DESC = {
  "Pre-A1": "Desde Cero: Sonidos, saludos y primeras palabras.",
  "A1": "Principiante: Presente simple y supervivencia diaria.",
  "A2": "Elemental: Pasado simple, rutinas y planes futuros.",
  "B1": "Intermedio: Phrasal verbs, condicionales y fluidez.",
  "B2": "Upper-Intermediate (100% English): Natural phrasing.",
  "C1": "Advanced (100% English): Idioms & executive nuance.",
  "C2": "Mastery (100% English): Near-native precision."
};

const DIAG = [
  { skill: "Gramática", lvl: "A1", q: "Completa: 'My brother ___ twenty years old.'", opts: ["am", "is", "are", "have"], ans: 1, exp: "La edad usa 'to be' ('is')." },
  { skill: "Oído/Dictado", lvl: "A1", audio: "I go to work every morning", dict: true, q: "Escucha y escribe exactamente en inglés:", ans: "i go to work every morning", exp: "Frase: 'I go to work every morning'." },
  { skill: "Lectura", lvl: "A2", q: "'I am running late. Please start without me.' ¿Qué pide?", opts: ["Cancelar", "Que empiecen sin esa persona", "Moverlo", "Llamar"], ans: 1, exp: "'Start without me' = empiecen sin mí." },
  { skill: "Gramática", lvl: "B1", q: "'If I ___ fluent in English, I would apply today.'", opts: ["am", "was", "were", "will be"], ans: 2, exp: "Segundo condicional formal: 'If I were...'." },
  { skill: "Oído/Dictado", lvl: "B2", audio: "Consistency beats intensity in the long run", dict: true, q: "Dictation - Type what you hear:", ans: "consistency beats intensity in the long run", exp: "Exact: 'Consistency beats intensity in the long run'." },
  { skill: "Lectura", lvl: "C1", q: "'The sample is too narrow to warrant sweeping policy changes.'", opts: ["Data is fake", "Sample is too small for major changes", "Change now", "Too many people"], ans: 1, exp: "'Too narrow to warrant' = muestra muy pequeña." },
  { skill: "Gramática", lvl: "C2", q: "'___ had the market calmed than another shock hit.'", opts: ["Hardly", "No sooner", "Scarcely", "Barely"], ans: 1, exp: "'No sooner ... than' es la estructura exacta." }
];

const EXAMS = {
  "Pre-A1": [
    { q: "¿Cómo se dice 'Mucho gusto en conocerte'?", opts: ["See you later", "Nice to meet you", "Good night"], ans: 1, exp: "'Nice to meet you'." },
    { q: "Completa: 'I ___ from Dominican Republic.'", opts: ["is", "are", "am"], ans: 2, exp: "Con 'I' siempre usamos 'am'." },
    { q: "¿Qué número es 'Seven'?", opts: ["5", "7", "9"], ans: 1, exp: "Seven = 7." }
  ],
  "A1": [
    { q: "Completa: 'She ___ coffee every morning.'", opts: ["drink", "drinks", "drinking"], ans: 1, exp: "Tercera persona singular lleva '-s'." },
    { q: "Negativo: 'We ___ eat fast food.'", opts: ["doesn't", "don't", "not"], ans: 1, exp: "Con 'We' usamos 'don't'." },
    { q: "Plural de 'Child':", opts: ["Childs", "Children", "Childrens"], ans: 1, exp: "Plural irregular: 'Children'." }
  ],
  "A2": [
    { q: "Pasado de 'drive': 'Yesterday they ___ to Santiago.'", opts: ["drive", "drove", "driven"], ans: 1, exp: "Pasado simple: 'drove'." },
    { q: "Comparativo: 'Today is ___ than yesterday.'", opts: ["hot", "more hot", "hotter"], ans: 2, exp: "Duplica consonante: 'hotter'." },
    { q: "Obligación: 'You ___ wear a seatbelt.'", opts: ["must", "can't", "mustn't"], ans: 0, exp: "'Must' expresa obligación." }
  ],
  "B1": [
    { q: "'If I ___ you, I would accept.'", opts: ["am", "was", "were"], ans: 2, exp: "'If I were you...'." },
    { q: "¿Qué significa 'call off'?", opts: ["Llamar", "Cancelar", "Posponer"], ans: 1, exp: "'Call off' = cancelar." },
    { q: "'She is used to ___ early.'", opts: ["wake up", "waking up", "woke up"], ans: 1, exp: "'Be used to' + '-ing'." }
  ],
  "B2": [
    { q: "'I would rather you ___ anyone yet.'", opts: ["don't tell", "didn't tell", "not tell"], ans: 1, exp: "'Would rather + subject + past simple'." },
    { q: "Collocation: 'The policy will ___ a major impact.'", opts: ["do", "make", "have"], ans: 2, exp: "'To have an impact'." },
    { q: "Meaning of 'cut corners':", opts: ["Drive fast", "Do something poorly to save time/money", "Increase budget"], ans: 1, exp: "Sacrifice quality to save effort." }
  ],
  "C1": [
    { q: "'___ had he spoken than shares surged.'", opts: ["Hardly", "No sooner", "Scarcely"], ans: 1, exp: "'No sooner ... than'." },
    { q: "Meaning of 'bite the bullet':", opts: ["Reject offer", "Face a difficult situation bravely", "Quit"], ans: 1, exp: "Endure an unavoidable hardship." },
    { q: "'The board insisted that he ___ present.'", opts: ["is", "be", "was"], ans: 1, exp: "Mandative subjunctive uses base 'be'." }
  ],
  "C2": [
    { q: "'He claims to be an expert, ___ his analysis misses the point.'", opts: ["albeit", "yet", "moreover"], ans: 1, exp: "'Yet' introduces a sharp contrast." },
    { q: "Meaning of 'to equivocate':", opts: ["Speak bluntly", "Use ambiguous language to avoid commitment", "Apologize"], ans: 1, exp: "Deliberate ambiguity." },
    { q: "'A ___ victory; legal fees exceeded the settlement.'", opts: ["pyrrhic", "resounding", "unanimous"], ans: 0, exp: "Won at too great a cost." }
  ]
};

let db = JSON.parse(localStorage.getItem("famEngPro_v6")) || [
  { id: 1, name: "Usuario 1", svg: "trader", level: null, done: "", xp: 0, streak: 0 },
  { id: 2, name: "Usuario 2", svg: "korean", level: null, done: "", xp: 0, streak: 0 },
  { id: 3, name: "Usuario 3", svg: "soto1", level: null, done: "", xp: 0, streak: 0 },
  { id: 4, name: "Usuario 4", svg: "soto2", level: null, done: "", xp: 0, streak: 0 }
];
let curUser = null;

function saveDB() { localStorage.setItem("famEngPro_v6", JSON.stringify(db)); }
function say(t, r) { if ("speechSynthesis" in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = r || 0.95; speechSynthesis.speak(u); } }

function renderHome() {
  curUser = null;
  document.getElementById("header-actions").classList.add("hidden");
  ["view-test", "view-dashboard", "view-lesson"].forEach(id => document.getElementById(id).classList.add("hidden"));
document.getElementById("view-profiles").classList.remove("hidden");
document.getElementById("profiles-grid").innerHTML = db.map(u =>
'' +
'✏️ Nombre' +
'' + SVGS[u.svg] + '' +
'' + u.name + '' +
'' + (u.level ? "Nivel " + u.level : "Evaluar nivel") + '' +
'🔥 ' + u.streak + ' · ⭐ ' + u.xp + ' XP'
).join("");
const sorted = [...db].sort((a, b) => b.xp - a.xp);
document.getElementById("leaderboard").innerHTML = sorted.map((u, i) =>
'#' + (i + 1) + ' ' + u.name + ' (' + (u.level || "Nuevo") + ')🔥 ' + u.streak + ' | ' + u.xp + ' XP'
).join("");
}
function renameUser(id) {
const u = db.find(x => x.id === id);
const n = prompt("Nuevo nombre para " + u.name + ":", u.name);
if (n && n.trim()) { u.name = n.trim(); saveDB(); renderHome(); }
}
function openUser(id) {
curUser = db.find(x => x.id === id);
document.getElementById("header-actions").classList.remove("hidden");
document.getElementById("hdr-streak").textContent = "🔥 " + curUser.streak;
document.getElementById("hdr-xp").textContent = "⭐ " + curUser.xp + " XP";
if (!curUser.level) showIntroChoice();
else showRoadmap();
}
function showIntroChoice() {
["view-profiles", "view-dashboard", "view-lesson"].forEach(id => document.getElementById(id).classList.add("hidden"));
const v = document.getElementById("view-test");
v.classList.remove("hidden");
v.innerHTML = '' + SVGS[curUser.svg] +
'¡Bienvenido, ' + curUser.name + '!' +
'Elige cómo comenzar tu ruta hasta Maestría C2:' +
'' +
'🎯 Hacer Examen Diagnóstico (Gramática, Oído con Dictado y Lectura)' +
'🌱 Empiezo desde CERO absoluto (Pre-A1)';
}
function setZeroLevel() { curUser.level = "Pre-A1"; curUser.done = ""; saveDB(); showRoadmap(); }
function startDiag() {
let idx = 0, score = 0;
const v = document.getElementById("view-test");
function drawQ() {
const q = DIAG[idx];
const audioHtml = q.audio ? '🔊 Escuchar🐢 Lento' : '';
const areaHtml = q.dict ? 'Comprobar'
: q.opts.map((o, i) => '' + o + '').join("");
v.innerHTML = '' + q.skill + ' · Nivel ' + q.lvl + '' + (idx + 1) + ' de ' + DIAG.length + '' +
'' + q.q + '' + audioHtml + '' + areaHtml + '' +
'Siguiente →';
if (q.audio) {
document.getElementById("btn-s1").onclick = () => say(q.audio, 0.95);
document.getElementById("btn-s2").onclick = () => say(q.audio, 0.65);
say(q.audio, 0.95);
}
const doneQ = (ok) => {
if (ok) score++;
const fb = document.getElementById("dq-fb");
fb.className = "feedback-box " + (ok ? "feedback-ok" : "feedback-err");
fb.innerHTML = '' + (ok ? "¡Correcto!" : "Detalle:") + ' ' + q.exp;
fb.classList.remove("hidden");
document.getElementById("dq-next").disabled = false;
};
if (q.dict) {
document.getElementById("dq-chk").onclick = () => {
const val = document.getElementById("dq-in").value.trim().toLowerCase().replace(/[.,!?']/g, "");
if (!val) return;
document.getElementById("dq-in").disabled = true; document.getElementById("dq-chk").disabled = true;
doneQ(val === q.ans);
};
} else {
document.querySelectorAll("#dq-area .option-btn").forEach(b => b.onclick = () => {
const c = Number(b.dataset.i);
document.querySelectorAll("#dq-area .option-btn").forEach((x, i) => { x.disabled = true; if (i === q.ans) x.classList.add("correct"); else if (i === c) x.classList.add("wrong"); });
doneQ(c === q.ans);
});
}
document.getElementById("dq-next").onclick = () => {
idx++;
if (idx < DIAG.length) drawQ();
else {
const assigned = LVLS[Math.min(score, LVLS.length - 1)];
curUser.level = assigned;
curUser.done = LVLS.slice(0, LVLS.indexOf(assigned)).join(",");
curUser.xp += 50; curUser.streak++; saveDB();
v.innerHTML = '📊 Diagnóstico CompletadoNivel Asignado: ' + assigned + ' (' + score + '/' + DIAG.length + ')Ir a mi Mapa →';
}
};
}
drawQ();
}
function showRoadmap() {
["view-profiles", "view-test", "view-lesson"].forEach(id => document.getElementById(id).classList.add("hidden"));
document.getElementById("view-dashboard").classList.remove("hidden");
document.getElementById("dash-welcome").textContent = "Hola, " + curUser.name;
document.getElementById("dash-subtitle").textContent = "Nivel actual: " + curUser.level + " · Regla: Aprobar examen al 100% para avanzar";
const doneList = curUser.done ? curUser.done.split(",") : [];
const curIdx = LVLS.indexOf(curUser.level);
document.getElementById("roadmap-list").innerHTML = LVLS.map((lvl, idx) => {
const isDone = doneList.includes(lvl);
const isCur = lvl === curUser.level;
const locked = idx > curIdx && !isDone;
const btn = locked ? '🔒' : '🎓 Examen 100%';
return '<div class="level-card ' + (isDone ? "completed" : isCur ? "current" : locked ? "locked" : "") + '">' +
'' + lvl + '' +
'' + lvl + (isDone ? " ✅" : "") + '' + DESC[lvl] + '' + btn + '';
}).join("");
}
function startExam100(lvl) {
["view-profiles", "view-test", "view-dashboard"].forEach(id => document.getElementById(id).classList.add("hidden"));
document.getElementById("view-lesson").classList.remove("hidden");
const qs = EXAMS[lvl];
let step = 0, okCount = 0, fails = [];
function draw() {
const q = qs[step];
document.getElementById("lesson-mode-badge").textContent = "🎓 Examen " + lvl + " (Obligatorio 100%)";
document.getElementById("lesson-progress").style.width = (((step + 1) / qs.length) * 100) + "%";
document.getElementById("lesson-container").innerHTML = 'Pregunta ' + (step + 1) + ' de ' + qs.length + '' +
'' + q.q + '' +
'' + q.opts.map((o, i) => '' + o + '').join("") + '' +
'Siguiente →';
document.querySelectorAll("#ex-o .option-btn").forEach(b => b.onclick = () => {
const c = Number(b.dataset.i);
const ok = c === q.ans;
document.querySelectorAll("#ex-o .option-btn").forEach((x, i) => { x.disabled = true; if (i === q.ans) x.classList.add("correct"); else if (i === c) x.classList.add("wrong"); });
if (ok) okCount++; else fails.push(q);
const fb = document.getElementById("ex-f");
fb.className = "feedback-box " + (ok ? "feedback-ok" : "feedback-err");
fb.innerHTML = '' + (ok ? "¡Correcto!" : "Error:") + ' ' + q.exp;
fb.classList.remove("hidden");
document.getElementById("ex-n").disabled = false;
});
document.getElementById("ex-n").onclick = () => {
step++;
if (step < qs.length) draw();
else {
const box = document.getElementById("lesson-container");
if (okCount === qs.length) {
const doneList = curUser.done ? curUser.done.split(",") : [];
if (!doneList.includes(lvl)) doneList.push(lvl);
curUser.done = doneList.join(",");
const nextIdx = LVLS.indexOf(lvl) + 1;
if (nextIdx < LVLS.length && LVLS.indexOf(curUser.level) < nextIdx) curUser.level = LVLS[nextIdx];
curUser.xp += 100; curUser.streak++; saveDB();
box.innerHTML = '🏆 ¡100% APROBADO!Subiste al nivel ' + curUser.level + ' (+100 XP).Continuar →';
} else {
box.innerHTML = '❌ No alcanzaste el 100% (' + okCount + '/' + qs.length + ')Debes responder todas sin fallos para avanzar:' +
fails.map(f => '' + f.q + '
💡 ' + f.exp + '').join("") +
'🔄 Repetir Examen';
}
}
};
}
draw();
}
renderHome();
