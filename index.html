<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family English Pro | 84 Unidades (Pre-A1 a C2)</title>
  <style>
    :root {
      --bg: #0b132b;
      --card: #1c2541;
      --card-light: #253256;
      --accent: #3a86ff;
      --accent-hover: #2563eb;
      --gold: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: #0f172a; border-bottom: 1px solid #1e293b;
      padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .brand h1 { margin: 0; font-size: 1.35rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .brand p { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }
    .badge-save {
      background: rgba(245, 158, 11, 0.15); border: 1px solid var(--gold);
      color: #fbbf24; padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    }
    main { max-width: 1050px; margin: 28px auto; padding: 0 20px; }
    .card {
      background: var(--card); border: 1px solid #2d3a5e; border-radius: 16px;
      padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .profiles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; margin-top: 20px; }
    .profile-card {
      background: var(--card-light); border: 2px solid transparent; border-radius: 14px;
      padding: 20px; text-align: center; cursor: pointer; transition: 0.2s;
    }
    .profile-card:hover { border-color: var(--accent); transform: translateY(-4px); }
    .avatar-circle {
      width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px;
      background: linear-gradient(135deg, #3a86ff, #8338ec); display: flex; align-items: center;
      justify-content: center; font-size: 2rem; font-weight: bold; color: #fff; border: 3px solid #38bdf8;
    }
    .btn {
      background: var(--accent); color: white; border: none; padding: 10px 18px;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border: 1px solid #475569; color: var(--text); }
    .btn-outline:hover { border-color: #94a3b8; }
    .btn-success { background: var(--success); }
    .btn-gold { background: var(--gold); color: #0f172a; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 700; background: #1e293b; color: #38bdf8; }
    .units-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
    .unit-box {
      background: var(--card-light); padding: 16px; border-radius: 12px; border: 1px solid #334155;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    }
    .unit-box.locked { opacity: 0.55; }
    .option-btn {
      display: block; width: 100%; text-align: left; background: #1e293b; color: var(--text);
      border: 1px solid #334155; padding: 12px 16px; border-radius: 10px; margin-bottom: 10px;
      cursor: pointer; font-size: 0.95rem;
    }
    .option-btn:hover { border-color: var(--accent); background: #26354d; }
    .word-chip {
      display: inline-block; background: #334155; color: #fff; padding: 8px 14px;
      border-radius: 8px; margin: 5px; cursor: pointer; font-weight: 600; user-select: none;
    }
    .dialogue-line { padding: 10px; border-bottom: 1px solid #2d3a5e; }
    .dialogue-line:last-child { border-bottom: none; }
    input[type="text"] {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 1rem; margin: 10px 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🌎 Family English Pro</h1>
      <p>Plan Anual • 84 Unidades (Pre-A1 a C2) • Avatares & Diagnóstico MCER</p>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button id="btn-switch-user" class="btn btn-outline hidden" onclick="showProfiles()">👥 Cambiar Perfil</button>
      <span class="badge-save">💾 Guardado local activo</span>
    </div>
  </header>

  <main id="app-root">
    <div class="card" style="text-align:center;">
      <p>Cargando motor de aprendizaje...</p>
    </div>
  </main>
    <script src="app.js"></script>
  <script src="curriculum.js"></script>
  <script src="exam.js"></script>
</body>
</html>
